# ByteTrack Tracker - Custom config for Divery underwater tracking
# track_buffer increased to 90 to handle temporary occlusion (3s at 30fps)

tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 90
match_thresh: 0.85
fuse_score: true
